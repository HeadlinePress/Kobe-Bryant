<style>
/* Deliberately single dark "app" look (a committed design, not theme-following): deep court-plum night,
   Lakers gold from the bundle as the one bold accent, mint for progress. The bundle pages stay bright paper. */
:root{
  color-scheme:dark;
  --bg:#130d17;--rail:#1a1220;--card:#221829;--card2:#2c2034;--line:#3a2c43;
  --ink:#f7f0f8;--muted:#b3a3bb;--dim:#7f6f88;
  --gold:#ffc23d;--gold-ink:#1c1206;--mint:#43e0a8;--rose:#ff7a8a;--answer:#1d2f7a;
  --d:"Bricolage Grotesque","Arial Black",sans-serif;--u:"Plus Jakarta Sans",system-ui,sans-serif;--b:"Nunito",system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--u);padding-inline:16px;padding-block:0 110px;min-height:100%;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(255,194,61,.09),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(122,60,160,.18),transparent 60%);background-attachment:fixed}
/* top bar with live progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;max-width:1240px;margin:0 auto;padding:12px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--gold);display:grid;place-items:center;color:var(--gold-ink);font:800 18px var(--d);font-style:normal;flex:none}
.logo b{font:800 17px/1.1 var(--d);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.logo small{display:block;font:600 11px var(--u);color:var(--muted);letter-spacing:.04em}
.prog{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),#9bf0cf);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog em{font:700 12px var(--u);color:var(--muted);font-style:normal;white-space:nowrap;font-variant-numeric:tabular-nums}
.me{display:flex;align-items:center;gap:8px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;background:var(--card2);border:2px solid var(--gold);display:grid;place-items:center;font:800 14px var(--d)}
.lv{background:var(--gold);color:var(--gold-ink);border-radius:99px;padding:3px 10px;font:800 12px var(--u)}
@media (max-width:640px){.prog em,.me span.nm,.logo small{display:none}.top{flex-wrap:wrap;gap:10px}.prog{order:3;flex-basis:100%}.logo{flex:1}}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:248px minmax(0,1fr);gap:28px;padding-top:10px}
@media (max-width:920px){.shell{grid-template-columns:1fr}.rail{position:static!important;display:flex!important;overflow-x:auto;gap:6px;padding:6px!important}.rail h4{display:none}.rail button{flex:none}}
/* left rail */
.rail{position:sticky;top:76px;align-self:start;background:var(--rail);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:2px;max-height:calc(100vh - 96px);overflow:auto}
.rail h4{margin:10px 10px 4px;font:800 10.5px var(--u);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font:600 13.5px var(--u);color:var(--muted)}
.rail button:hover{background:var(--card)}
.rail .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font:800 10px var(--u)}
.rail .done .dot{background:var(--mint);border-color:var(--mint);color:#06281c}
.rail .on{background:var(--card2);color:var(--ink)}
.rail .on .dot{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,194,61,.18)}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{min-width:0}
.stack{display:grid;gap:22px}
.kicker{font:800 11.5px var(--u);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.h1{font:800 clamp(30px,4.6vw,52px)/1 var(--d);letter-spacing:-.025em;margin:6px 0 10px;text-wrap:balance}
.lede{color:var(--muted);max-width:60ch;margin:0;font-size:16px}
.btn{font:800 15px var(--u);border:0;border-radius:14px;padding:13px 22px;cursor:pointer;background:var(--gold);color:var(--gold-ink);box-shadow:0 6px 0 #b8841c;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8841c}
.btn.ghost{background:var(--card2);color:var(--ink);box-shadow:0 6px 0 #150e19}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:880px;padding-top:6px}
.note{font-size:13.5px;color:var(--muted)}
.field{display:grid;gap:8px;font:700 13px var(--u);color:var(--muted)}
.inp{font:700 20px var(--u);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
.inp:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px rgba(255,194,61,.15)}
/* welcome */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;background:var(--rail);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,4vw,44px);overflow:hidden}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero .covers{position:relative;max-width:100%}
.hero .covers img{width:100%;display:block;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5);transform:rotate(2deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font:700 12.5px var(--u);color:var(--muted)}
.form2{display:grid;grid-template-columns:1fr 150px;gap:12px}@media (max-width:520px){.form2{grid-template-columns:1fr}}
/* slides */
.stage{position:relative;background:#000;border-radius:22px;overflow:hidden;aspect-ratio:792/612;max-width:100%;cursor:pointer;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.stage .cnt{position:absolute;right:14px;top:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:99px;padding:4px 12px;font:800 12px var(--u);color:#fff}
.sctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-top:10px}
.thumbs img{height:62px;aspect-ratio:792/612;border-radius:8px;cursor:pointer;opacity:.5;border:2px solid transparent;flex:none;transition:opacity .2s}
.thumbs img.on{opacity:1;border-color:var(--gold)}
/* level */
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:880px}
@media (max-width:680px){.levels{grid-template-columns:repeat(2,1fr)}}
.lvl{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:10px;transition:transform .15s,border-color .15s}
.lvl:hover{transform:translateY(-3px)}
.lvl strong{font:800 34px/1 var(--d);letter-spacing:-.02em}
.lvl .meter{display:flex;gap:4px}.lvl .meter i{flex:1;height:6px;border-radius:9px;background:var(--card2)}.lvl .meter i.f{background:var(--gold)}
.lvl span{font:700 12px var(--u);color:var(--muted)}
.lvl[aria-pressed=true]{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,194,61,.14),var(--card));box-shadow:0 12px 30px rgba(255,194,61,.12)}
.groups{display:grid;gap:16px;max-width:880px}
.grp h3{margin:0 0 8px;font:800 11.5px var(--u);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{position:relative;cursor:pointer}
.tg input{position:absolute;opacity:0}
.tg span{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:8px 14px;font:700 13.5px var(--u);color:var(--muted);transition:all .15s}
.tg span::before{content:"+";font:800 15px var(--u);width:14px;text-align:center}
.tg input:checked+span{background:rgba(67,224,168,.13);border-color:var(--mint);color:var(--ink)}
.lockchip span::before{content:"✓"!important;color:var(--mint)}
.tg input:checked+span::before{content:"✓";color:var(--mint)}
.tg input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
/* activity header + page sheets */
.acthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:880px}
.acthead .h1{font-size:clamp(26px,3.6vw,40px);margin-bottom:0}
.pagechip{background:var(--card2);border-radius:99px;padding:5px 12px;font:800 12px var(--u);color:var(--muted);font-variant-numeric:tabular-nums}
.sheetwrap{display:grid;gap:10px;max-width:880px}
.sheet{position:relative;width:100%;max-width:880px;aspect-ratio:612/792;background:#fcf5ed;border-radius:10px;overflow:hidden;color-scheme:light;container-type:inline-size;box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
.sheet>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sheet.draw canvas{pointer-events:auto;cursor:crosshair;touch-action:none}
.sheet.textmode{cursor:text}
.ov{position:absolute;margin:0;border:0;background:transparent;color:var(--answer);font-family:var(--b);font-weight:600;padding:0 .4cqw;resize:none;overflow:hidden;color-scheme:light}
.ov:hover{background:rgba(255,194,61,.10)}
.ov:focus{outline:2px solid rgba(226,163,58,.85);background:rgba(255,255,255,.4)}
.zone{line-height:var(--lh);padding-top:calc(var(--lh) * .3);font-size:min(calc(var(--lh) * .5),2.2cqw)}
.zone{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(60,27,58,.45) transparent}
.zone.over{box-shadow:inset 0 -1.2cqw 1cqw -1cqw rgba(226,163,58,.7)}
.more{position:absolute;transform:translate(-100%,-40%);z-index:3;border:0;border-radius:99px;background:#3c1b3a;color:#fff;font:700 1.45cqw/1 var(--u);padding:.7cqw 1.2cqw;cursor:pointer;box-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.3);white-space:nowrap}
.more span{color:#ffc23d}
.sheet:not(:hover) .more.idle{opacity:.0}
.ed-back{position:fixed;inset:0;z-index:50;background:rgba(10,6,12,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.ed{width:min(760px,100%);max-height:calc(100vh - 32px);display:grid;grid-template-rows:auto 1fr auto;gap:12px;background:var(--rail);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.ed h3{margin:0;font:800 22px var(--d)}
.ed textarea{width:100%;min-height:50vh;resize:vertical;background:#fcf5ed;color:#1d2f7a;border:0;border-radius:12px;padding:8px 16px 14px;font:600 18px/34px var(--b);background-image:repeating-linear-gradient(to bottom,transparent 0 32px,rgba(60,27,58,.3) 32px 33.5px);background-position:0 8px;background-repeat:repeat-y;background-attachment:local;color-scheme:light}
.ed textarea:focus{outline:3px solid var(--gold)}
.ed-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fld{font-size:1.8cqw;line-height:1;display:flex;align-items:flex-end;padding-bottom:.2cqw}
.cell{text-align:center;font:800 2.1cqw var(--b);text-transform:uppercase;padding:0;border-radius:3px}
.mc{position:absolute;cursor:pointer;border-radius:6px}
.mc:hover{background:rgba(255,194,61,.14)}
.mc .ring{position:absolute;border:.45cqw solid var(--answer);border-radius:50%;width:4.2cqw;height:4.2cqw;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:transform .18s cubic-bezier(.3,1.6,.5,1),opacity .12s}
.mc.on .ring{transform:translate(-50%,-50%) scale(1);opacity:1}
.tb{position:absolute;min-width:6cqw;font:600 2cqw/1.25 var(--b);color:var(--answer);background:transparent;border:1px dashed transparent;padding:0 .3cqw;white-space:pre-wrap;outline:none}
.tb:focus,.tb:hover{border-color:rgba(226,163,58,.9);background:rgba(255,255,255,.5)}
/* floating tool dock */
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:4px;background:rgba(34,24,41,.86);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.5);max-width:calc(100vw - 24px);overflow-x:auto}
.dock button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;min-width:54px;padding:7px 8px;border-radius:15px;color:var(--muted);font:700 10.5px var(--u)}
.dock button svg{width:21px;height:21px}
.dock button:hover{color:var(--ink);background:var(--card2)}
.dock button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}
.dock .sep{width:1px;height:30px;background:var(--line);margin:0 4px;flex:none}
.dock .sw{min-width:0;width:22px;height:22px;padding:0;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.dock .sw[aria-pressed=true]{border-color:var(--ink);background:inherit}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font:600 13px var(--u);color:var(--ink);z-index:29;pointer-events:none;opacity:0;transition:opacity .25s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
/* finish */
.done{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--rail);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,4vw,40px);max-width:880px}
@media (max-width:620px){.done{grid-template-columns:1fr}}
.ring2{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--mint) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center}
.ring2 div{width:118px;height:118px;border-radius:50%;background:var(--rail);display:grid;place-items:center;text-align:center;font:800 30px/1 var(--d)}
.ring2 small{display:block;font:700 11px var(--u);color:var(--muted);margin-top:4px}
.list{display:grid;gap:8px;max-width:880px}
.list div{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700}
.tag{border-radius:99px;padding:3px 10px;font:800 11.5px var(--u)}
.tag.ok{background:rgba(67,224,168,.15);color:var(--mint)}.tag.no{background:rgba(255,122,138,.14);color:var(--rose)}
.picker{display:grid;gap:14px;background:var(--rail);border:1px solid var(--line);border-radius:24px;padding:clamp(16px,3vw,28px);max-width:880px}
.pk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pk-btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font:700 12.5px var(--u);color:var(--ink)}
.chip:hover{border-color:var(--gold)}
.pk-grp{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.pk-t{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.pk-row{display:flex;gap:10px;flex-wrap:wrap}
.pk{position:relative;cursor:pointer;display:grid;gap:4px;justify-items:center;font:700 11.5px var(--u);color:var(--muted)}
.pk input{position:absolute;top:6px;left:6px;width:20px;height:20px;accent-color:#43e0a8;z-index:1}
.pk img{width:92px;aspect-ratio:612/792;object-fit:cover;border-radius:6px;border:3px solid transparent;opacity:.45;transition:opacity .15s,border-color .15s}
.pk input:checked~img{opacity:1;border-color:var(--mint)}
.pk input:focus-visible~img{outline:3px solid var(--gold)}
.dock .listen{color:var(--ink);background:rgba(67,224,168,.14)}
.dock .listen[aria-pressed=true]{background:var(--mint);color:#06281c}
:root{--zoom:1}
main{overflow-x:auto}
.sheetwrap,.acthead{max-width:calc(880px * var(--zoom))}
.sheetwrap .sheet{max-width:calc(880px * var(--zoom));width:calc(100% * 1)}
@media (min-width:921px){.sheetwrap{width:calc(min(880px,100%) * var(--zoom))}}
.saylayer{position:absolute;inset:0;pointer-events:none;z-index:4}
.saylayer i{position:absolute;background:rgba(255,206,74,.38);border-radius:.4cqw;box-shadow:0 0 0 .3cqw rgba(255,206,74,.38);transition:all .15s}
.sheet.listening .sayhit{position:absolute;z-index:5;cursor:pointer;border-radius:.4cqw}
.sheet.listening .sayhit:hover{background:rgba(67,224,168,.18)}
.vw{position:absolute;z-index:2;background:transparent;border:0;border-bottom:.25cqw dotted #d18a12;cursor:help;padding:0}
.vw:hover,.vw:focus-visible{background:rgba(255,194,61,.22)}
.pop{position:fixed;z-index:45;max-width:300px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.pop b{display:block;font:800 18px var(--d);color:var(--gold);text-transform:capitalize}
.pop p{margin:4px 0 0;font-size:14px}

.rul i{position:absolute;left:0;right:0;background:rgba(10,6,12,.55)}
.rul i:first-child{top:0}.rul i:last-child{bottom:0}
.player{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:31;display:flex;align-items:center;gap:6px;background:rgba(34,24,41,.95);backdrop-filter:blur(14px);border:1px solid var(--mint);border-radius:18px;padding:6px 8px;box-shadow:0 18px 50px rgba(0,0,0,.5);max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
.player button{all:unset;cursor:pointer;min-width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font:800 13px var(--u);color:var(--ink);padding:0 8px}
.player button:hover{background:var(--card2)}
.player .pp{background:var(--mint);color:#06281c;min-width:44px;font-size:16px}
.player .sp[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}
.player .pt{font:700 12px var(--u);color:var(--muted);padding:0 6px}
.resume{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font:700 12.5px var(--u);color:var(--ink)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,6,12,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.modal>div{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--rail);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:16px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.linkbox input{all:unset;flex:1;min-width:0;font:600 13px var(--u);color:var(--ink)}
.viewtog{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function wrap(x,text,maxW){const out=[];String(text).split('\n').forEach(par=>{let line='';par.split(/(\s+)/).forEach(w=>{const t=line+w;if(x.measureText(t).width>maxW&&line.trim()){out.push(line.trimEnd());line=w.trimStart()}else line=t});out.push(line)});return out}
function needPages(){return window.PAGES?Promise.resolve():new Promise((ok,no)=>{const t=document.createElement('script');t.src='data/pages.js';t.onload=ok;t.onerror=no;document.head.appendChild(t)})}
async function renderPage(n){const more=[];await needPages();const img=await loadImg(PAGES[n]);const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');x.drawImage(img,0,0);
 const k=c.width/M.pageW,g=M.geo[n];x.fillStyle='#1d2f7a';x.textBaseline='alphabetic';
 g.fields.forEach(f=>{const v=f.k==='name'?S.name:f.k==='date'?new Date().toLocaleDateString():S.cls;x.font=`600 ${11*k}px Nunito, sans-serif`;x.fillText(v||'',(f.x+3)*k,(f.y+f.h-3)*k)});
 g.zones.forEach((z,i)=>{const t=S.a[`p${n}_${i}`];if(!t)return;const fs=Math.min(z.lh*.5,13.5);x.font=`600 ${fs*k}px Nunito, sans-serif`;let ls=wrap(x,t,(z.w-5)*k);
  if(ls.length<=z.n){ls.forEach((l,j)=>x.fillText(l,(z.x+2.5)*k,(z.first+z.lh*j-z.lh*.2)*k));return}
  // too long: shrink to fit the same space (down to 70%), keeping text readable
  for(let sc=.92;sc>=.7;sc-=.04){const f=fs*sc;x.font=`600 ${f*k}px Nunito, sans-serif`;const l2=wrap(x,t,(z.w-5)*k);if(l2.length<=z.n){l2.forEach((l,j)=>x.fillText(l,(z.x+2.5)*k,(z.first+z.lh*j-z.lh*.2)*k));return}}
  // still too long: fill the lines, then continue on an extra page
  x.font=`600 ${fs*k}px Nunito, sans-serif`;ls.slice(0,z.n).forEach((l,j)=>x.fillText(l,(z.x+2.5)*k,(z.first+z.lh*j-z.lh*.2)*k));
  x.save();x.font=`800 ${8.5*k}px Nunito, sans-serif`;x.fillStyle='#b3261e';x.textAlign='right';x.fillText('continued on next page →',(z.x+z.w-2)*k,(z.first+z.lh*(z.n-1)+9)*k);x.restore();
  more.push(t)});
 g.mc.forEach(m=>{if(S.a['mc'+lvl()+'_'+m.q]!==m.c)return;x.strokeStyle='#1d2f7a';x.lineWidth=2.4*k;x.beginPath();x.arc(m.cx*k,m.cy*k,12.5*k,0,Math.PI*2);x.stroke()});
 (g.cells||[]).forEach((cl,i)=>{const t=S.a[`p${n}_c${i}`];if(!t)return;x.font=`800 ${12*k}px Nunito, sans-serif`;x.textAlign='center';x.fillText(t,(cl.x+cl.s/2)*k,(cl.y+cl.s*.72)*k);x.textAlign='left'});
 paint(x,S.st[n]||[],c.width,c.height);
 (S.tx[n]||[]).forEach(t=>{x.font=`600 ${12.2*k}px Nunito, sans-serif`;t.s.split('\n').forEach((l,j)=>x.fillText(l,t.x*c.width+2*k,t.y*c.height+(j+1)*15.3*k-3*k))});
 return{img:c.toDataURL('image/jpeg',.86),more}}
function contPages(texts,title){const out=[];const W=1275,H=1650,k=W/612;const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fcf5ed';x.fillRect(0,0,W,H);x.fillStyle='#3c1b3a';x.beginPath();x.roundRect(40*k,40*k,532*k,46*k,6*k);x.fill();x.fillStyle='#fcf5ed';x.font=`800 ${17*k}px Nunito, sans-serif`;x.fillText('Continued · '+title,56*k,69*k);x.fillStyle='#2a1328';x.font=`700 ${10*k}px Nunito, sans-serif`;x.fillText(`Name: ${S.name}    Level: ${lvl()}`,44*k,108*k);x.strokeStyle='rgba(60,27,58,.35)';x.lineWidth=1*k;for(let y=150;y<=740;y+=24){x.beginPath();x.moveTo(44*k,y*k);x.lineTo(568*k,y*k);x.stroke()}return{c,x}};
 let p=mk(),row=0;const put=l=>{if(row>=25){out.push(p.c.toDataURL('image/jpeg',.86));p=mk();row=0}p.x.fillStyle='#1d2f7a';p.x.font=`600 ${13*k}px Nunito, sans-serif`;p.x.fillText(l,48*k,(146+row*24)*k);row++};
 texts.forEach((t,ti)=>{p.x.font=`600 ${13*k}px Nunito, sans-serif`;wrap(p.x,t,516*k).forEach(put);if(ti<texts.length-1)put('')});out.push(p.c.toDataURL('image/jpeg',.86));return out}
async function downloadPdf(){const msg=$('#pdfMsg'),btn=$('#pdfGo');btn.disabled=true;
 try{const dl=(await window.claude?.use?.('downloads'))||{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();return{status:'saved'}}};
  await document.fonts.ready;const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'letter'});
  const pages=selectedPages();
  for(let i=0;i<pages.length;i++){msg.textContent=`Making your PDF… page ${i+1} of ${pages.length}`;if(i>0)pdf.addPage();const r=await renderPage(pages[i]);pdf.addImage(r.img,'JPEG',0,0,612,792);if(r.more.length){const st=stepList().find(s=>s.pages?.includes(pages[i]));contPages(r.more,st?.t||'Writing').forEach(im=>{pdf.addPage();pdf.addImage(im,'JPEG',0,0,612,792)})}}
  const safe=t=>String(t).replace(/[^\w\- ]+/g,'').trim();msg.textContent='Your PDF is ready. Confirm the download.';
  await dl.save({filename:`${safe(S.name)||'Student'} - ${safe(M.title)}.pdf`,data:pdf.output('blob')});msg.textContent='Saved! Attach the PDF to an email or share it with your teacher.';
 }catch(e){console.log('pdf',e);msg.textContent=e?.code==='declined'?'Download cancelled.':'Could not make the PDF. Please try again.'}finally{btn.disabled=false}}

(window.MANIFEST?Promise.resolve(MANIFEST):Promise.reject(new Error('nomanifest'))).then(m=>{M=m;load();applyHash();$('#btitle').textContent=M.title;$('#grade').textContent=M.grade+' · Reading & Writing';render()}).catch(()=>$('#main').innerHTML='<div class="hero" style="display:block"><h1 class="h1" style="font-size:30px">The lesson files can’t be found</h1><p class="lede">Unzip the folder first (right-click the zip, then Extract All), then open <b>Kobe Bryant Lesson Player.html</b> from the unzipped folder. Keep the audio, data, pages and slides folders next to it.</p></div>');
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches||confetti.done)return;confetti.done=true;const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:['#ffc23d','#43e0a8','#ff7a8a','#b98bff','#fff'][Math.floor(Math.random()*5)],a:Math.random()*6}));let f=0;
 (function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<180)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}
$('#saveProg').onclick=saveProgress;$('#pdfOpen').onclick=openPdf;$('#teachBtn').onclick=teacherTools;setInterval(()=>{const t=$('#teachBtn');if(t&&S)t.hidden=!!S.locked},1000);addEventListener('hashchange',()=>{applyHash();render()});
let armed=false;$('#resetBtn').onclick=()=>{const b=$('#resetBtn');if(!armed){armed=true;b.textContent='Tap again to erase everything';setTimeout(()=>{armed=false;b.textContent='Start over'},4000);return}armed=false;b.textContent='Start over';const lk=S.locked?{l:S.level,k:S.lockKey,a:S.acts}:null;S=fresh();if(lk){S.level=lk.l;S.locked=true;S.lockKey=lk.k;S.acts=lk.a}save();render()};
